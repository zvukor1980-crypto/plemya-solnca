  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <header id="hud">
        <div class="hud-top">
          <div class="lvl" aria-label="Уровень"><b id="lvl">1</b><span>ур.</span></div>
          <div class="xp" aria-label="Опыт">
            <div id="xpbar"></div>
            <em id="xptxt">0/60</em>
          </div>
          <button class="gear" data-act="settings" aria-label="Меню" type="button">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.2 3.1-1.6-.3a6.7 6.7 0 0 0-.6-1.4l1-1.3-1.6-1.6-1.3 1a6.7 6.7 0 0 0-1.4-.6l-.3-1.6h-2.2l-.3 1.6c-.5.1-1 .4-1.4.6l-1.3-1-1.6 1.6 1 1.3c-.2.4-.4.9-.6 1.4l-1.6.3v2.2l1.6.3c.2.5.4 1 .6 1.4l-1 1.3 1.6 1.6 1.3-1c.4.2.9.5 1.4.6l.3 1.6h2.2l.3-1.6c.5-.1 1-.4 1.4-.6l1.3 1 1.6-1.6-1-1.3c.2-.4.4-.9.6-1.4l1.6-.3v-2.2Z"/></svg>
          </button>
        </div>
        <div class="pills">
          <div class="pill" id="pill-pop"></div>
          <div class="pill" id="pill-food"></div>
          <div class="pill" id="pill-shells"></div>
          <div class="pill sun" id="pill-sun"></div>
        </div>
      </header>
      <button id="questbar" data-act="open-quest" type="button"></button>
      <div id="card"></div>
      <div id="placebar" class="hidden"></div>
      <div id="tutor" class="hidden"></div>
      <nav id="nav">
        <button data-act="nav-build" type="button"><span class="nicon red"></span>Стройка</button>
        <button data-act="nav-shop" type="button"><span class="nicon orange"></span>Лавка</button>
        <button data-act="nav-bag" type="button"><span class="nicon green"></span>Склад</button>
        <button data-act="nav-map" type="button"><span class="nicon blue"></span>Острова</button>
        <button data-act="nav-tribe" type="button"><span class="nicon purple"></span>Племя</button>
      </nav>
      <section id="sheet" class="hidden"></section>
      <div id="modal" class="hidden"></div>
      <div id="toasts"></div>
      <div id="boot">
        <div class="boot-sun"></div>
        <p class="eyebrow">островная игра</p>
        <h1>Племя<br />Солнца</h1>
        <p class="lead">Сажай кукурузу, строй хижины и открывай острова. Всё сохраняется на этом телефоне.</p>
        <button id="boot-btn" class="btn green xl" type="button">Играть</button>
      </div>
    </div>
  </body>
</html>
